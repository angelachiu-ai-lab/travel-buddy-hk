<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Buddy HK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); }
        
        .glow-active {
            border: 2px solid transparent;
            background: #e5e7eb;
            position: relative;
            border-radius: 2.2rem;
        }
        .glow-active::after {
            content: '';
            position: absolute;
            top: -3px; left: -3px; right: -3px; bottom: -3px;
            border-radius: 2.3rem;
            border: 2px solid #c084fc;
            box-shadow: 0 0 15px rgba(192, 132, 252, 0.5), inset 0 0 10px rgba(192, 132, 252, 0.3);
            pointer-events: none;
            z-index: 1;
        }

        .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="max-w-7xl mx-auto w-full flex justify-between items-center py-8 px-6">
        <h1 class="text-3xl font-black tracking-tighter text-slate-900">Travel Buddy <span class="text-blue-600">HK</span></h1>
        
        <nav class="flex bg-slate-200 p-1 rounded-xl shadow-inner">
            <button id="btn-local" onclick="switchMode('local')" class="px-8 py-2 rounded-lg font-bold transition-all duration-300 bg-white shadow-sm text-blue-600">Local</button>
            <button id="btn-intl" onclick="switchMode('intl')" class="px-8 py-2 rounded-lg font-bold text-slate-500 hover:text-slate-700 transition-all duration-300">International</button>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto w-full p-4 md:p-8 flex-grow">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-start">
            
            <div class="lg:col-span-4 space-y-6">
                <!-- Local Panel -->
                <div id="local-panel" class="glow-active p-8 card-shadow slide-up">
                    <div class="space-y-8 relative z-10">
                        <div class="relative">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2 mb-3 block">Departure Point</label>
                            <div class="relative">
                                <input list="all-locations" id="start-node" 
                                    oninput="checkDynamicRoute()" 
                                    onfocus="this.value=''; checkDynamicRoute()" 
                                    placeholder="Enter Location" 
                                    class="w-full pl-5 pr-12 py-5 bg-slate-200 border-2 border-transparent rounded-2xl outline-none transition-all focus:bg-white focus:border-purple-400 text-slate-700 font-medium">
                                <button onclick="detectLocation()" title="Detect My Location" class="absolute right-3 top-1/2 -translate-y-1/2 p-2.5 text-blue-500 hover:bg-white rounded-xl transition-all">
                                    <i class="fas fa-location-crosshairs text-lg" id="geo-icon"></i>
                                </button>
                            </div>
                        </div>

                        <div class="relative">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2 mb-3 block">Destination Point</label>
                            <input list="all-locations" id="end-node" 
                                oninput="checkDynamicRoute()" 
                                onfocus="this.value=''; checkDynamicRoute()" 
                                placeholder="Where to?" 
                                class="w-full px-5 py-5 bg-slate-200 border-2 border-transparent rounded-2xl outline-none transition-all focus:bg-white focus:border-purple-400 text-slate-700 font-medium">
                        </div>
                    </div>

                    <datalist id="all-locations"></datalist>

                    <div class="pt-8 mt-8 flex justify-end items-center border-t border-slate-300 relative z-10">
                        <button onclick="clearInputs()" class="text-[11px] font-black text-blue-600 hover:text-blue-800 uppercase tracking-widest transition-colors">Clear Fields</button>
                    </div>
                </div>

                <!-- International Panel (Filtered Continent Buttons) -->
                <div id="intl-panel" class="hidden bg-white p-8 rounded-[2.5rem] card-shadow slide-up space-y-6 border border-slate-100">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2 block">Search Global Cities</label>
                    <input type="text" id="intl-search" oninput="searchIntl()" placeholder="Country or City..." 
                        class="w-full px-5 py-4 bg-slate-100 border-2 border-transparent rounded-2xl outline-none focus:bg-white focus:border-blue-500">
                    <div class="flex flex-wrap gap-2">
                        <button onclick="filterIntl('All')" id="intl-btn-All" class="px-4 py-1.5 rounded-full text-[10px] font-black uppercase bg-slate-900 text-white transition-all">All</button>
                        <button onclick="filterIntl('Asia')" id="intl-btn-Asia" class="px-4 py-1.5 rounded-full text-[10px] font-black uppercase bg-slate-100 text-slate-500 transition-all">Asia</button>
                        <button onclick="filterIntl('Europe')" id="intl-btn-Europe" class="px-4 py-1.5 rounded-full text-[10px] font-black uppercase bg-slate-100 text-slate-500 transition-all">Europe</button>
                        <button onclick="filterIntl('Americas')" id="intl-btn-Americas" class="px-4 py-1.5 rounded-full text-[10px] font-black uppercase bg-slate-100 text-slate-500 transition-all">Americas</button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-8 h-full">
                <div id="placeholder-view" class="h-full min-h-[450px] bg-slate-200/50 rounded-[3rem] border-2 border-dashed border-slate-300 flex flex-col items-center justify-center p-12 text-center">
                    <div class="w-24 h-24 bg-slate-300/50 rounded-full flex items-center justify-center mb-8">
                        <i class="fas fa-map-marked-alt text-4xl text-slate-400"></i>
                    </div>
                    <h3 class="text-3xl font-black text-slate-400 uppercase tracking-widest">Ready to explore</h3>
                    <p class="max-w-md mt-4 text-slate-500 text-lg font-medium leading-relaxed">Enter your departure and destination on the left.<br>We'll show you the best MTR, Bus, and Taxi trade-offs.</p>
                </div>

                <div id="local-results" class="hidden space-y-6"></div>
                <div id="intl-results" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
        </div>
    </main>

    <script>
        const districts = {
            'Central': { region: 'HK', lat: 22.2819, lon: 114.1581 },
            'Wan Chai': { region: 'HK', lat: 22.2760, lon: 114.1751 },
            'Causeway Bay': { region: 'HK', lat: 22.2800, lon: 114.1850 },
            'Quarry Bay': { region: 'HK', lat: 22.2850, lon: 114.2130 },
            'Kennedy Town': { region: 'HK', lat: 22.2830, lon: 114.1270 },
            'Stanley': { region: 'HK', lat: 22.2180, lon: 114.2130 },
            'Tsim Sha Tsui': { region: 'Kln', lat: 22.2988, lon: 114.1722 },
            'Mong Kok': { region: 'Kln', lat: 22.3193, lon: 114.1694 },
            'Kwun Tong': { region: 'Kln', lat: 22.3130, lon: 114.2260 },
            'Sham Shui Po': { region: 'Kln', lat: 22.3300, lon: 114.1620 },
            'Shatin': { region: 'NT', lat: 22.3810, lon: 114.1880 },
            'Tuen Mun': { region: 'NT', lat: 22.3910, lon: 113.9780 },
            'Tsuen Wan': { region: 'NT', lat: 22.3710, lon: 114.1140 },
            'Tai Po': { region: 'NT', lat: 22.4500, lon: 114.1700 },
            'Yuen Long': { region: 'NT', lat: 22.4450, lon: 114.0220 },
            'Tung Chung': { region: 'NT', lat: 22.2890, lon: 113.9430 }
        };

        const intlCities = [
            // Asia
            { name: 'Shenzhen', country: 'China', continent: 'Asia', visa: 'Return Permit', transport: 'HSR / Metro', cost: 'Low', desc: 'Tech hub & shopping destination.' },
            { name: 'Shanghai', country: 'China', continent: 'Asia', visa: 'Return Permit', transport: 'Flight 2.5h', cost: 'Mid', desc: 'The Bund and modern skyscrapers.' },
            { name: 'Beijing', country: 'China', continent: 'Asia', visa: 'Return Permit', transport: 'Flight 3h', cost: 'Mid', desc: 'Imperial history and the Great Wall.' },
            { name: 'Tokyo', country: 'Japan', continent: 'Asia', visa: 'Visa Free', transport: 'Flight 4.5h', cost: 'High', desc: 'Electric city with world-class food.' },
            { name: 'Bangkok', country: 'Thailand', continent: 'Asia', visa: 'Visa Free', transport: 'Flight 2.5h', cost: 'Low', desc: 'Temples, street food, and vibrant markets.' },
            
            // Europe
            { name: 'London', country: 'UK', continent: 'Europe', visa: 'Visa Free', transport: 'Flight 13h', cost: 'High', desc: 'Historic landmarks and global theater.' },
            { name: 'Paris', country: 'France', continent: 'Europe', visa: 'Visa Free', transport: 'Flight 13h', cost: 'High', desc: 'City of light, art, and romance.' },
            
            // Americas
            { name: 'New York', country: 'USA', continent: 'Americas', visa: 'Visa Required', transport: 'Flight 16h', cost: 'High', desc: 'The Big Apple, Broadway, and Central Park.' },
            { name: 'Los Angeles', country: 'USA', continent: 'Americas', visa: 'Visa Required', transport: 'Flight 13h', cost: 'High', desc: 'Hollywood, beaches, and Santa Monica Pier.' },
            { name: 'Vancouver', country: 'Canada', continent: 'Americas', visa: 'eTA Required', transport: 'Flight 12h', cost: 'Mid', desc: 'Scenic mountain views and mild climate.' },
            { name: 'Toronto', country: 'Canada', continent: 'Americas', visa: 'eTA Required', transport: 'Flight 15h', cost: 'High', desc: 'Canada\'s financial hub and CN Tower.' },
            { name: 'San Francisco', country: 'USA', continent: 'Americas', visa: 'Visa Required', transport: 'Flight 12.5h', cost: 'High', desc: 'Golden Gate Bridge and tech culture.' }
        ];

        let currentFilter = 'All';

        function initApp() {
            const list = document.getElementById('all-locations');
            list.innerHTML = '';
            const regions = [
                { id: 'HK', label: '--- HONG KONG ISLAND ---' },
                { id: 'Kln', label: '--- KOWLOON ---' },
                { id: 'NT', label: '--- NEW TERRITORIES ---' }
            ];
            regions.forEach(reg => {
                const header = document.createElement('option');
                header.value = reg.label;
                list.appendChild(header);
                Object.keys(districts).filter(name => districts[name].region === reg.id).forEach(name => {
                    const option = document.createElement('option');
                    option.value = name;
                    list.appendChild(option);
                });
            });
        }

        function switchMode(mode) {
            const isLocal = mode === 'local';
            document.getElementById('local-panel').classList.toggle('hidden', !isLocal);
            document.getElementById('intl-panel').classList.toggle('hidden', isLocal);
            document.getElementById('local-results').classList.toggle('hidden', !isLocal);
            document.getElementById('intl-results').classList.toggle('hidden', isLocal);
            
            document.getElementById('btn-local').className = isLocal ? 'px-8 py-2 rounded-lg font-bold transition-all bg-white shadow-sm text-blue-600' : 'px-8 py-2 rounded-lg font-bold text-slate-500';
            document.getElementById('btn-intl').className = !isLocal ? 'px-8 py-2 rounded-lg font-bold transition-all bg-white shadow-sm text-blue-600' : 'px-8 py-2 rounded-lg font-bold text-slate-500';

            if (isLocal) checkDynamicRoute();
            else searchIntl();
        }

        function checkDynamicRoute() {
            const startName = document.getElementById('start-node').value.trim();
            const endName = document.getElementById('end-node').value.trim();

            if (districts[startName] && districts[endName] && startName !== endName) {
                renderLocalResults(districts[startName], districts[endName]);
            } else {
                document.getElementById('placeholder-view').classList.remove('hidden');
                document.getElementById('local-results').classList.add('hidden');
            }
        }

        function renderLocalResults(start, end) {
            document.getElementById('placeholder-view').classList.add('hidden');
            const container = document.getElementById('local-results');
            container.classList.remove('hidden');
            container.innerHTML = '';

            const dist = Math.sqrt(Math.pow(start.lat - end.lat, 2) + Math.pow(start.lon - end.lon, 2)) * 111;
            const isCrossHarbor = (start.region === 'HK' && end.region !== 'HK') || (start.region !== 'HK' && end.region === 'HK');
            
            const mtr = isCrossHarbor ? 12.5 + dist * 0.45 : 4.8 + dist * 0.55;
            let bus = isCrossHarbor ? ( (start.region === 'NT' || end.region === 'NT') ? 22.7 + (dist * 0.2) : 11.6 + (dist * 0.3) ) : 5.4 + (dist * 0.5);
            const taxi = 27 + (dist * 9.8) + (isCrossHarbor ? 25 : 0);

            const modes = [
                { type: 'MTR Octopus', cost: mtr, time: Math.round(dist * 2.2 + 6), icon: 'fa-train', color: 'red' },
                { type: 'Bus Fare', cost: bus, time: Math.round(dist * 4.5 + 10), icon: 'fa-bus', color: 'blue' },
                { type: 'Taxi Estimate', cost: taxi, time: Math.round(dist * 3 + 4), icon: 'fa-taxi', color: 'yellow' }
            ];

            modes.forEach(mode => {
                const div = document.createElement('div');
                div.className = `bg-white p-8 rounded-[2.5rem] card-shadow border-l-8 border-${mode.color === 'red' ? 'red' : (mode.color === 'blue' ? 'blue' : 'yellow')}-500 slide-up flex items-center justify-between group hover:translate-x-1 transition-all`;
                div.innerHTML = `
                    <div class="flex items-center gap-6">
                        <div class="w-16 h-16 rounded-3xl bg-slate-100 flex items-center justify-center">
                            <i class="fas ${mode.icon} text-3xl text-slate-600"></i>
                        </div>
                        <div>
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">${mode.type}</p>
                            <h4 class="text-4xl font-black text-slate-800">$${mode.cost.toFixed(1)}</h4>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-xl font-black text-slate-600">${mode.time} mins</p>
                        <p class="text-[9px] font-black text-slate-300 uppercase mt-1">${isCrossHarbor ? 'Cross-Harbor' : 'Regional'}</p>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function searchIntl() {
            const query = document.getElementById('intl-search').value.toLowerCase();
            const results = intlCities.filter(city => {
                const matchesSearch = city.name.toLowerCase().includes(query) || city.country.toLowerCase().includes(query);
                const matchesFilter = currentFilter === 'All' || city.continent === currentFilter;
                return matchesSearch && matchesFilter;
            });
            renderIntlResults(results);
        }

        function filterIntl(continent) {
            currentFilter = continent;
            ['All', 'Asia', 'Europe', 'Americas'].forEach(c => {
                const btn = document.getElementById(`intl-btn-${c}`);
                if (btn) btn.className = c === continent ? 'px-4 py-1.5 rounded-full text-[10px] font-black uppercase bg-slate-900 text-white transition-all' : 'px-4 py-1.5 rounded-full text-[10px] font-black uppercase bg-slate-100 text-slate-500 transition-all';
            });
            searchIntl();
        }

        function renderIntlResults(cities) {
            const container = document.getElementById('intl-results');
            container.classList.remove('hidden');
            document.getElementById('placeholder-view').classList.add('hidden');
            container.innerHTML = '';
            
            cities.forEach(city => {
                const div = document.createElement('div');
                div.className = 'bg-white p-6 rounded-[2rem] card-shadow slide-up flex flex-col justify-between hover:scale-[1.02] transition-transform duration-300';
                div.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h4 class="text-2xl font-black text-slate-900 leading-tight">${city.name}</h4>
                                <p class="text-xs font-bold text-blue-600 uppercase tracking-widest">${city.country}</p>
                            </div>
                            <span class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-[9px] font-black uppercase">${city.visa}</span>
                        </div>
                        <p class="text-slate-500 text-sm mb-6">${city.desc}</p>
                    </div>
                    <div class="pt-4 border-t border-slate-100 grid grid-cols-2 gap-4">
                        <div>
                            <p class="text-[9px] font-black text-slate-300 uppercase">Transport</p>
                            <p class="text-sm font-bold text-slate-700">${city.transport}</p>
                        </div>
                        <div>
                            <p class="text-[9px] font-black text-slate-300 uppercase">Cost Level</p>
                            <p class="text-sm font-bold text-slate-700">${city.cost}</p>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function detectLocation() {
            const icon = document.getElementById('geo-icon');
            icon.className = 'fas fa-spinner fa-spin text-blue-500';
            navigator.geolocation.getCurrentPosition((pos) => {
                let nearest = null; let minDist = Infinity;
                Object.keys(districts).forEach(name => {
                    const d = districts[name];
                    const dist = Math.sqrt(Math.pow(pos.coords.latitude - d.lat, 2) + Math.pow(pos.coords.longitude - d.lon, 2));
                    if (dist < minDist) { minDist = dist; nearest = name; }
                });
                if (nearest) { document.getElementById('start-node').value = nearest; checkDynamicRoute(); }
                icon.className = 'fas fa-location-crosshairs text-lg';
            }, () => icon.className = 'fas fa-location-crosshairs text-lg');
        }

        function clearInputs() {
            document.getElementById('start-node').value = '';
            document.getElementById('end-node').value = '';
            checkDynamicRoute();
        }

        window.onload = initApp;
    </script>
</body>
</html>
